  <!-- Main Content -->

    <!-- Content Area -->

<!-- Toast -->
<div id="toast" class="fixed bottom-6 right-6 z-50 hidden transform transition-all duration-300 translate-y-10 opacity-0">
  <div class="bg-slate-800 text-white px-6 py-3 rounded-lg shadow-xl flex items-center gap-3">
    <i id="toast-icon" class="fas fa-check-circle text-green-400"></i>
    <span id="toast-message">Operación exitosa</span>
  </div>
</div>

<!-- Modal Container -->

<script>

// ==================== CONFIGURACIÓN SUPABASE ====================
// REEMPLAZAR con tus credenciales de Supabase
const SUPABASE_URL = 'https://guwsjhryhmnzralvkyms.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Nc1B8YSCxh3zymfrqmyx9A_GyL6CMHP';

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Variables globales
let currentUser = null;
let userRole = null;
let currentView = 'dashboard';
let editingId = null;
let editingType = null;

// ==================== UTILIDADES ====================
function $(id){ return document.getElementById(id); }
function showToast(msg, type='success'){
  const toast=$('toast');
  const icon=$('toast-icon');
  $('toast-message').textContent=msg;
  icon.className=type==='success'?'fas fa-check-circle text-green-400':(type==='error'?'fas fa-times-circle text-red-400':'fas fa-info-circle text-blue-400');
  toast.classList.remove('hidden','translate-y-10','opacity-0');
  setTimeout(()=>{toast.classList.add('translate-y-10','opacity-0');setTimeout(()=>toast.classList.add('hidden'),300);},3000);
}
function formatDate(d){ if(!d)return'-'; const x=new Date(d); return x.toLocaleDateString('es-VE'); }
function formatDateTime(d){ if(!d)return'-'; const x=new Date(d); return x.toLocaleString('es-VE'); }
function escapeHtml(t){ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
function togglePassword(){ const p=$('login-password'),i=p.nextElementSibling.querySelector('i'); if(p.type==='password'){p.type='text';i.className='fas fa-eye-slash';}else{p.type='password';i.className='fas fa-eye';} }
function toggleSidebar(){ $('sidebar').classList.toggle('-translate-x-full'); }

// ==================== AUTH ====================
async function init(){
  $('current-date').textContent=new Date().toLocaleDateString('es-VE',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  const {data:{session}}=await supabase.auth.getSession();
  if(session){ await loadUser(session.user); }
  else{ showLogin(); }
}

function showLogin(){ $('login-screen').classList.remove('hidden'); $('app-screen').classList.add('hidden'); }
function showApp(){ $('login-screen').classList.add('hidden'); $('app-screen').classList.remove('hidden'); }

async function loadUser(user){
  currentUser=user;
  const {data:profile}=await supabase.from('profiles').select('*').eq('id',user.id).single();
  if(!profile||!profile.activo){ showToast('Usuario inactivo o no encontrado','error'); await supabase.auth.signOut(); showLogin(); return; }
  userRole=profile.rol;
  $('user-name').textContent=`${profile.nombres} ${profile.apellidos}`;
  $('user-role').textContent=profile.rol.toUpperCase();
  $('user-avatar').textContent=(profile.nombres[0]+profile.apellidos[0]).toUpperCase();

  // Mostrar menú admin según rol
  if(userRole==='superadmin'||userRole==='admin'){
    $('menu-admin').classList.remove('hidden');
  }

  // Ocultar opciones según rol
  if(userRole==='asistente_administrativo'){
    hideNav(['consultas','rehabilitacion','medicos','fisioterapeutas','especialidades','terapias','estados']);
  } else if(userRole==='fisiatra'){
    hideNav(['citas','rehabilitacion','usuarios','auditoria']);
  } else if(userRole==='fisioterapeuta'){
    hideNav(['citas','consultas','usuarios','auditoria']);
  }

  showApp();
  navigate('dashboard');
}

function hideNav(ids){ ids.forEach(id=>{ const el=$(`nav-${id}`); if(el)el.classList.add('hidden'); }); }

$('login-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  $('login-error').classList.add('hidden');
  const email=$('login-email').value;
  const password=$('login-password').value;
  const {data,error}=await supabase.auth.signInWithPassword({email,password});
  if(error){ $('login-error').textContent=error.message; $('login-error').classList.remove('hidden'); }
  else { await loadUser(data.user); }
});

async function logout(){ await supabase.auth.signOut(); currentUser=null; userRole=null; showLogin(); }

// ==================== NAVEGACIÓN ====================
function navigate(view){
  currentView=view;
  document.querySelectorAll('.sidebar-link').forEach(l=>l.classList.remove('active'));
  const nav=$(`nav-${view}`); if(nav) nav.classList.add('active');

  const titles={
    dashboard:'Dashboard', pacientes:'Pacientes', citas:'Control de Citas',
    consultas:'Consultas Médicas', rehabilitacion:'Control de Rehabilitación',
    medicos:'Médicos (Fisiatras)', fisioterapeutas:'Fisioterapeutas',
    especialidades:'Especialidades', terapias:'Tipos de Terapia', estados:'Estados',
    usuarios:'Usuarios del Sistema', auditoria:'Auditoría'
  };
  $('page-title').textContent=titles[view]||view;

  switch(view){
    case 'dashboard': renderDashboard(); break;
    case 'pacientes': renderPacientes(); break;
    case 'citas': renderCitas(); break;
    case 'consultas': renderConsultas(); break;
    case 'rehabilitacion': renderRehabilitacion(); break;
    case 'medicos': renderMedicos(); break;
    case 'fisioterapeutas': renderFisioterapeutas(); break;
    case 'especialidades': renderEspecialidades(); break;
    case 'terapias': renderTerapias(); break;
    case 'estados': renderEstados(); break;
    case 'usuarios': renderUsuarios(); break;
    case 'auditoria': renderAuditoria(); break;
  }
}

// ==================== DASHBOARD ====================
async function renderDashboard(){
  const area=$('content-area');
  area.innerHTML='<div class="flex items-center justify-center h-64"><i class="fas fa-circle-notch fa-spin text-3xl text-teal-600"></i></div>';

  const [{count:pacCount},{count:citaCount},{count:consCount},{count:ctrlCount},{data:recentPacientes},{data:hoyCitas}]=await Promise.all([
    supabase.from('pacientes').select('*',{count:'exact',head:true}),
    supabase.from('citas').select('*',{count:'exact',head:true}).eq('estado','Pendiente'),
    supabase.from('consultas').select('*',{count:'exact',head:true}),
    supabase.from('control_rehabilitacion').select('*',{count:'exact',head:true}).eq('estado','Activo'),
    supabase.from('pacientes').select('*').order('created_at',{ascending:false}).limit(5),
    supabase.from('citas').select('*,paciente:paciente_id(nombres,apellidos,cedula)').eq('fecha',new Date().toISOString().split('T')[0]).order('hora')
  ]);

  area.innerHTML=`
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8 fade-in">
    <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-100 card-hover">
      <div class="flex items-center justify-between">
        <div><p class="text-sm text-slate-500">Total Pacientes</p><p class="text-3xl font-bold text-slate-800">${pacCount||0}</p></div>
        <div class="w-12 h-12 bg-teal-100 rounded-xl flex items-center justify-center"><i class="fas fa-user-injured text-teal-600 text-xl"></i></div>
      </div>
    </div>
    <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-100 card-hover">
      <div class="flex items-center justify-between">
        <div><p class="text-sm text-slate-500">Citas Pendientes</p><p class="text-3xl font-bold text-amber-600">${citaCount||0}</p></div>
        <div class="w-12 h-12 bg-amber-100 rounded-xl flex items-center justify-center"><i class="fas fa-calendar-check text-amber-600 text-xl"></i></div>
      </div>
    </div>
    <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-100 card-hover">
      <div class="flex items-center justify-between">
        <div><p class="text-sm text-slate-500">Consultas Realizadas</p><p class="text-3xl font-bold text-blue-600">${consCount||0}</p></div>
        <div class="w-12 h-12 bg-blue-100 rounded-xl flex items-center justify-center"><i class="fas fa-stethoscope text-blue-600 text-xl"></i></div>
      </div>
    </div>
    <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-100 card-hover">
      <div class="flex items-center justify-between">
        <div><p class="text-sm text-slate-500">Rehabilitaciones Activas</p><p class="text-3xl font-bold text-emerald-600">${ctrlCount||0}</p></div>
        <div class="w-12 h-12 bg-emerald-100 rounded-xl flex items-center justify-center"><i class="fas fa-wheelchair text-emerald-600 text-xl"></i></div>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 fade-in">
    <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-6">
      <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2"><i class="fas fa-user-plus text-teal-600"></i> Pacientes Recientes</h3>
      <div class="table-container">
        <table class="w-full text-sm">
          <thead><tr class="border-b border-slate-200 text-slate-500"><th class="text-left py-2">Historia</th><th class="text-left">Nombre</th><th class="text-left">Cédula</th><th class="text-left">Ingreso</th></tr></thead>
          <tbody>
            ${(recentPacientes||[]).map(p=>`<tr class="border-b border-slate-50 hover:bg-slate-50"><td class="py-2 font-mono text-teal-700">${p.numero_historia}</td><td>${p.nombres} ${p.apellidos}</td><td>${p.cedula}</td><td>${formatDate(p.fecha_ingreso)}</td></tr>`).join('')||'<tr><td colspan="4" class="py-4 text-center text-slate-400">Sin registros</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
    <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-6">
      <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2"><i class="fas fa-calendar-day text-teal-600"></i> Citas de Hoy</h3>
      <div class="table-container">
        <table class="w-full text-sm">
          <thead><tr class="border-b border-slate-200 text-slate-500"><th class="text-left py-2">Hora</th><th class="text-left">Paciente</th><th class="text-left">Tipo</th><th class="text-left">Estado</th></tr></thead>
          <tbody>
            ${(hoyCitas||[]).map(c=>`<tr class="border-b border-slate-50 hover:bg-slate-50"><td class="py-2">${c.hora}</td><td>${c.paciente?.nombres||''} ${c.paciente?.apellidos||''}</td><td><span class="px-2 py-0.5 rounded-full text-xs bg-slate-100">${c.tipo_cita}</span></td><td><span class="px-2 py-0.5 rounded-full text-xs ${c.estado==='Pendiente'?'bg-amber-100 text-amber-700':(c.estado==='Atendida'?'bg-green-100 text-green-700':'bg-red-100 text-red-700')}">${c.estado}</span></td></tr>`).join('')||'<tr><td colspan="4" class="py-4 text-center text-slate-400">Sin citas hoy</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  </div>`;
}

// ==================== CRUD GENÉRICO ====================
async function renderCrud(config){
  const {title,table,fields,cols,canAdd,canEdit,canDelete,extraActions,modalWidth} = config;
  const area=$('content-area');

            <th class="text-left px-4 py-3 font-semibold">Acciones</th>

          <tbody>`;

  (data||[]).forEach(row=>{
    html+=`<tr class="border-b border-slate-50 hover:bg-slate-50 transition" data-search="${Object.values(row).join(' ').toLowerCase()}">

        else if(c.type==='color') val=`<span class="inline-block w-4 h-4 rounded-full" style="background:${val}"></span> ${val}`;

        return `<td class="px-4 py-3">${val}</td>`;

        <div class="flex items-center gap-2">
          ${canEdit!==false&&(userRole==='superadmin'||userRole==='admin'||canEdit===true)?`<button onclick="openModal('${table}',${row.id})" class="text-blue-600 hover:bg-blue-50 p-2 rounded-lg transition" title="Editar"><i class="fas fa-edit"></i></button>`:''}

    ${!data||data.length===0?'<div class="p-8 text-center text-slate-400">No hay registros</div>':''}
  </div></div>`;
  area.innerHTML=html;
}

function filterTable(table){
  const term=$('search-'+table).value.toLowerCase();
  document.querySelectorAll(`#table-${table} tbody tr`).forEach(tr=>{
    tr.style.display=tr.dataset.search.includes(term)?'':'none';
  });
}

function exportTable(table){
  const tbl=document.getElementById('table-'+table);
  if(!tbl){showToast('No hay datos para exportar','error');return;}
  const wb=XLSX.utils.table_to_book(tbl,{sheet:table});
  XLSX.writeFile(wb,`${table}_${new Date().toISOString().split('T')[0]}.xlsx`);
  showToast('Exportado exitosamente');
}

async function deleteRecord(table,id){
  if(!confirm('¿Está seguro de eliminar este registro?'))return;
  const {error}=await supabase.from(table).delete().eq('id',id);
  if(error){showToast(error.message,'error');}else{showToast('Eliminado correctamente'); navigate(currentView);}
}

// ==================== MODAL ====================
function openModal(type,id=null){
  editingId=id; editingType=type;
  const modal=$('modal-container');
  const content=$('modal-content');
  modal.classList.remove('hidden');

  const configs={
    especialidades:{title:'Especialidad',fields:[{key:'nombre',label:'Nombre',type:'text',required:true},{key:'descripcion',label:'Descripción',type:'textarea'}]},
    terapias:{title:'Tipo de Terapia',fields:[{key:'nombre',label:'Nombre',type:'text',required:true},{key:'descripcion',label:'Descripción',type:'textarea'},{key:'duracion_minutos',label:'Duración (min)',type:'number'}]},
    estados:{title:'Estado',fields:[{key:'nombre',label:'Nombre',type:'text',required:true},{key:'descripcion',label:'Descripción',type:'textarea'},{key:'color',label:'Color',type:'color'}]},
  };

  let html=`<div class="p-6 border-b border-slate-200 flex items-center justify-between">
    <h3 class="text-lg font-bold text-slate-800">${id?'Editar':'Nuevo'} ${configs[type]?.title||type}</h3>
    <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button>
  </div>
  <form id="modal-form" class="p-6 space-y-4" onsubmit="saveModal(event)">`;

  if(configs[type]){
    configs[type].fields.forEach(f=>{
      html+=`<div><label class="block text-sm font-medium text-slate-700 mb-1">${f.label}${f.required?' *':''}</label>`;
      if(f.type==='textarea') html+=`<textarea name="${f.key}" ${f.required?'required':''} rows="3" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none"></textarea>`;
      else if(f.type==='color') html+=`<input type="color" name="${f.key}" class="w-full h-10 rounded-lg border border-slate-300">`;
      else html+=`<input type="${f.type}" name="${f.key}" ${f.required?'required':''} class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">`;
      html+=`</div>`;
    });
  }

  html+=`<div class="flex justify-end gap-3 pt-4">
    <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-300 rounded-lg hover:bg-slate-50 transition">Cancelar</button>
    <button type="submit" class="px-4 py-2 bg-teal-700 hover:bg-teal-800 text-white rounded-lg transition"><i class="fas fa-save mr-1"></i> Guardar</button>
  </div></form>`;

  content.innerHTML=html;
  content.style.maxWidth='28rem';

  if(id && configs[type]){
    supabase.from(type).select('*').eq('id',id).single().then(({data})=>{
      if(data) configs[type].fields.forEach(f=>{
        const el=content.querySelector(`[name="${f.key}"]`);
        if(el) el.value=data[f.key]||'';
      });
    });
  }
}

function closeModal(){ $('modal-container').classList.add('hidden'); editingId=null; editingType=null; }

async function saveModal(e){
  e.preventDefault();
  const form=e.target;
  const data={};
  new FormData(form).forEach((v,k)=>{ data[k]=v===''?null:v; if(k==='duracion_minutos')data[k]=parseInt(v)||0; });

  let res;
  if(editingId) res=await supabase.from(editingType).update(data).eq('id',editingId);
  else res=await supabase.from(editingType).insert([data]);

  if(res.error){showToast(res.error.message,'error');}
  else{closeModal(); showToast('Guardado correctamente'); navigate(currentView);}
}

async function savePaciente(e){
  e.preventDefault();
  const fd=new FormData(e.target);
  const data={};
  fd.forEach((v,k)=>{ if(v!==''){ if(k.endsWith('_id'))data[k]=parseInt(v)||null; else data[k]=v; } });

  let res;
  if(editingId) res=await supabase.from('pacientes').update(data).eq('id',editingId);
  else res=await supabase.from('pacientes').insert([data]);

  if(res.error){showToast(res.error.message,'error');}
  else{closeModal(); showToast('Paciente guardado correctamente'); navigate('pacientes');}
}

async function saveMedico(e){
  e.preventDefault();
  const fd=new FormData(e.target);
  const data={};
  fd.forEach((v,k)=>{ if(k==='activo')data[k]=true; else if(v!==''){ if(k==='especialidad_id')data[k]=parseInt(v)||null; else data[k]=v; } });
  if(!fd.has('activo'))data.activo=false;

  let res;
  if(editingId) res=await supabase.from('medicos').update(data).eq('id',editingId);
  else res=await supabase.from('medicos').insert([data]);

  if(res.error){showToast(res.error.message,'error');}
  else{closeModal(); showToast('Médico guardado correctamente'); navigate('medicos');}
}

async function saveCita(e){
  e.preventDefault();
  const fd=new FormData(e.target);
  const data={};
  fd.forEach((v,k)=>{ if(v!==''){ if(k.endsWith('_id'))data[k]=parseInt(v)||null; else data[k]=v; } });
  data.creado_por=currentUser.id;
  let res;
  if(editingId) res=await supabase.from('citas').update(data).eq('id',editingId);
  else res=await supabase.from('citas').insert([data]);
  if(res.error){showToast(res.error.message,'error');}
  else{closeModal(); showToast('Cita guardada correctamente'); navigate('citas');}
}

function mostrarDatosPaciente(){
  const sel=$('rehab-paciente');
  if(!sel||!sel.selectedOptions[0])return;
  const opt=sel.selectedOptions[0];
  $('rehab-edad').textContent=opt.dataset.edad||'-'; 
  $('rehab-sexo').textContent=opt.dataset.sexo||'-'; 
  $('rehab-fn').textContent=opt.dataset.fn?formatDate(opt.dataset.fn):'-'; 
  $('rehab-estado').textContent=opt.dataset.estado||'-'; 
  $('rehab-condicion').textContent=opt.dataset.condicion||'-'; 
}

async function saveRehab(e){
  e.preventDefault();
  const fd=new FormData(e.target);
  const data={};
  fd.forEach((v,k)=>{ if(v!==''){ if(k.endsWith('_id'))data[k]=parseInt(v)||null; else data[k]=v; } });
  data.creado_por=currentUser.id;
  let res;
  if(editingId) res=await supabase.from('control_rehabilitacion').update(data).eq('id',editingId);
  else res=await supabase.from('control_rehabilitacion').insert([data]).select();
  if(res.error){showToast(res.error.message,'error');return;}

  // Si es nuevo, crear 15 sesiones vacías
  if(!editingId && res.data && res.data[0]){
    const controlId=res.data[0].id;
    const sesionesVacias=[];
    for(let i=1;i<=15;i++){
      sesionesVacias.push({control_id:controlId,terapia_id:null,fisioterapeuta_id:null,fecha:null,hora_inicio:null,hora_fin:null,observaciones:null,evolucion:null,creado_por:currentUser.id});
    }
    await supabase.from('sesiones_terapia').insert(sesionesVacias);
  }

  closeModal(); showToast('Control guardado correctamente'); navigate('rehabilitacion');
}

async function guardarPlanilla(e,controlId){
  e.preventDefault();
  const fd=new FormData(e.target);

  // Procesar 15 sesiones
  for(let i=1;i<=15;i++){
    const sesionId=fd.get(`sesion_${i}_id`);
    const data={
      control_id:controlId,
      fisioterapeuta_id:fd.get(`sesion_${i}_fisioterapeuta_id`)||null,
      terapia_id:fd.get(`sesion_${i}_terapia_id`)||null,
      fecha:fd.get(`sesion_${i}_fecha`)||null,
      creado_por:currentUser.id
    };
    if(data.fisioterapeuta_id) data.fisioterapeuta_id=parseInt(data.fisioterapeuta_id);
    if(data.terapia_id) data.terapia_id=parseInt(data.terapia_id);

    if(sesionId){
      await supabase.from('sesiones_terapia').update(data).eq('id',sesionId);
    } else if(data.fisioterapeuta_id||data.terapia_id||data.fecha){
      await supabase.from('sesiones_terapia').insert([data]);
    }
  }

  showToast('Planilla guardada correctamente');
  closeModal(); navigate('rehabilitacion');
}

async function saveUsuario(e){
  e.preventDefault();
  const fd=new FormData(e.target);
  const payload={};
  fd.forEach((v,k)=>{ if(v!=='')payload[k]=v; });

  if(!editingId){
    const res=await fetch(`${SUPABASE_URL}/functions/v1/create-user`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${(await supabase.auth.getSession()).data.session.access_token}`},
      body:JSON.stringify(payload)
    });
    const result=await res.json();
    if(!res.ok){showToast(result.error||'Error creando usuario','error');return;}
  } else {
    const body={user_id:editingId};
    if(payload.email)body.email=payload.email;
    if(payload.password)body.password=payload.password;
    if(payload.cedula)body.cedula=payload.cedula;
    if(payload.nombres)body.nombres=payload.nombres;
    if(payload.apellidos)body.apellidos=payload.apellidos;
    if(payload.telefono)body.telefono=payload.telefono;
    if(payload.rol)body.rol=payload.rol;
    body.activo=fd.has('activo');

    const res=await fetch(`${SUPABASE_URL}/functions/v1/update-user`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${(await supabase.auth.getSession()).data.session.access_token}`},
      body:JSON.stringify(body)
    });
    const result=await res.json();
    if(!res.ok){showToast(result.error||'Error actualizando','error');return;}
  }
  closeModal(); showToast('Usuario guardado correctamente'); navigate('usuarios');
}

async function deleteUsuario(id){
  if(!confirm('¿Eliminar permanentemente este usuario?'))return;
  const res=await fetch(`${SUPABASE_URL}/functions/v1/delete-user`,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':`Bearer ${(await supabase.auth.getSession()).data.session.access_token}`},
    body:JSON.stringify({user_id:id})
  });
  if(!res.ok){showToast('Error eliminando usuario','error');return;}
  showToast('Usuario eliminado'); navigate('usuarios');
}
